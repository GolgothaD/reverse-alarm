<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>"><meta name="theme-color" content="#1b1430"><title>Reverse Alarm</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120d08;color:#f5e6c8;font-family:'Space Mono',monospace;min-height:100vh}
main{max-width:480px;margin:auto;padding:16px}
h1{font-family:Bungee;color:#ff5a36;text-align:center;font-size:2.2rem;margin:10px 0 0;text-shadow:3px 3px 0 #6b1d0c}
.sub{text-align:center;color:#c9a96e;margin:0 0 14px;font-size:.85rem}
.bench{background:linear-gradient(#5b3a1e,#3a2410);border:4px solid #8a5a2b;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 6px 0 #1e1208}
.clock{font-family:Bungee;font-size:clamp(2rem,11vw,3.4rem);white-space:nowrap;text-align:center;color:#ffd166;text-shadow:0 0 18px #ff8c00}
label{display:block;margin:8px 0 4px;color:#ffd166}
input,textarea{width:100%;box-sizing:border-box;background:#1d130b;color:#fff;border:2px solid #8a5a2b;border-radius:8px;padding:10px;font:inherit;font-size:1rem}
button{font-family:Bungee;font-size:1rem;border:0;border-radius:10px;padding:12px;margin-top:10px;width:100%;background:#ff5a36;color:#fff;box-shadow:0 4px 0 #8a2a12;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a2a12}
button.alt{background:#5a7d9a;box-shadow:0 4px 0 #2c3e50}
.ringing{animation:shake .15s infinite;background:#7a0f0f!important}@keyframes shake{50%{transform:translateX(4px) rotate(1deg)}}
.judge{display:flex;gap:12px;align-items:flex-start}.face{font-size:3rem}
.verdict{font-family:Bungee;font-size:1.5rem;text-align:center;margin:8px 0}.granted{color:#7fff7f}.denied{color:#ff4d4d}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.85rem}.scores div{background:#1d130b;padding:6px;border-radius:6px}
.hist{overflow-wrap:anywhere;font-size:.8rem;color:#c9a96e;border-top:1px dashed #8a5a2b;padding:6px 0}
.warn{font-size:.85rem;color:#e0c48e;text-align:center}
input,select,textarea,button{min-height:44px}</style></head><body><main>
<h1>⚖️ Reverse Alarm</h1><p class="sub">The Honorable Judge Snoozewell presiding</p>
<div class="bench" id="setup"><div class="clock" id="now">--:--</div>
<label for="wake">Wake me at</label><input type="time" id="wake"><button id="arm">Arm the alarm</button><button class="alt" id="test">Ring it now (test)</button>
<p id="status" class="warn" aria-live="polite"></p><p class="warn">⚠️ Keep this tab open and your phone awake: browsers can't ring a closed tab.</p></div>
<div class="bench" id="court" hidden><div class="judge"><div class="face" id="face">👨‍⚖️</div><div id="speech" aria-live="polite" style="overflow-wrap:anywhere">ORDER! You wish to sleep longer? Make your case.</div></div>
<label for="excuse">Your excuse</label><textarea id="excuse" rows="3" maxlength="500" placeholder="Your Honor, my dreams were in a critical plot arc..."></textarea>
<button class="alt" id="mic">🎤 Plead out loud</button><p class="warn" id="micNote" hidden>🎤 Voice pleas aren't supported in this browser. Type your excuse.</p><button id="plead">Submit plea</button>
<div id="result"></div></div>
<div class="bench"><b>Case history</b><div id="history"></div></div>
</main><script src="app.js"></script></body></html>
